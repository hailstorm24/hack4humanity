app = "h4h-narrative-stubs"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  STUB_DB = "/data/data.db"
  PUBLIC_URL = "https://h4h-narrative-stubs.fly.dev"

# SQLite lives on this volume, so run exactly one machine.
[mounts]
  source = "stubs_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
