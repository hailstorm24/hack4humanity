# Render Blueprint: free web service running all three stubs in one process (stubs/server.py).
# Free tier: sleeps after 15 min idle (~1 min cold start). Data lives in Postgres (DATABASE_URL, e.g. Neon free);
# without it the service falls back to SQLite on the container disk, which Render wipes on every sleep/deploy.
services:
  - type: web
    name: h4h-narrative-stubs
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./stubs/Dockerfile
    dockerContext: ./stubs
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DEV_KEY          # header X-Dev-Key for /v1/_dev/... ; read it in the Render dashboard
        generateValue: true
      - key: DATABASE_URL     # Postgres connection string; set in the dashboard, never committed
        sync: false
      - key: MANAGER_BOT_TOKEN  # manager bot token from @BotFather; set in the dashboard, never committed
        sync: false
